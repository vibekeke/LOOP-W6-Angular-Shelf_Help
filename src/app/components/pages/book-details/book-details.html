<div class="flex-1 flex-col items-center justify-center p-4 md:p-12 md:px-28">
    <div class="flex flex-row">
        <a routerLink="/BookCatalogue" class="relative inline-flex items-center gap-2 font-bold text-lg 
            after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:bg-current
            after:origin-right after:scale-x-0 after:transition-transform after:duration-250
            hover:after:origin-left hover:after:scale-x-100">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M12 5v16" />
                <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />
            </svg>
            Back to Catalogue
        </a>
    </div>
    <div class="flex flex-col md:flex-row gap-4 mt-8">
    @if (book(); as loadedBook) {
        <div class="flex items-center flex-1 md:flex-none md:w-2/5 md:shrink-0 min-w-0 bg-paper shadow-md">
            <div class="overflow-hidden min-w-0 w-full">
                <img appHoverZoom
                    [alt]="loadedBook.title"
                    [src]="loadedBook.coverImg"
                    loading="lazy"
                    class="w-full object-contain max-h-[26rem] py-6 md:py-10"
                />
                <svg fill="#000000" height="40px" width="40px" id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier"> 
                        <path class="cls-1" d="M13.07336,12.29053,10.14679,9.364a3.9711,3.9711,0,1,0-.78284.78284l2.92658,2.92657Zm-6.064-2.4516A2.82914,2.82914,0,1,1,9.8385,7.00934,2.83286,2.83286,0,0,1,7.00934,9.83893Z"></path> 
                    </g>
                </svg>
            </div>
        </div>
        
        <div class="relative overflow-hidden flex flex-col justify-evenly md:flex-1 min-w-0 px-6 md:px-10 gap-3 bg-paper shadow-md">
            <!-- Saved indicator -->
            @if (userService.isInCollection(loadedBook.id)) {
                    <div class="absolute top-0 right-0 w-20 h-20 bg-linear-to-br from-brand to-brand-dark [clip-path:polygon(100%_0,100%_100%,0_0)] drop-shadow-md shadow-md">
                    <svg viewBox="0 0 26 26" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="absolute top-3 right-3 w-5 h-5 drop-shadow-sm">
                        <path d="M20 6 9 17l-5-5" />
                    </svg>
                    </div>
                }
            <div class="">
                <h2 class="break-words">{{loadedBook.title}}</h2>

                <h5>Author: {{loadedBook.author}}</h5>
                <p class="text-brand">Isbn: {{loadedBook.isbn}}</p>
                <p class="pt-8">Rating: {{loadedBook.rating}}</p>
                <p class="pt-18">{{loadedBook.blurb}}</p>
            </div>
            <div>
                <app-collection-button [book]="loadedBook" />
            </div>
        </div>    
    }
    </div>
</div>
