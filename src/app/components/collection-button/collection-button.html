@if (variant() === 'remove') {
  <button
    type="button"
    (click)="removeFromReadingList()"
    [disabled]="isLoadingList()"
    [attr.aria-label]="'Remove ' + book().title + ' from your list'"
    class="inline-flex items-center gap-1.5 rounded-sm bg-linear-to-br from-danger-light to-paper px-3 py-1.5 text-md font-medium border border-red-950 text-ink shadow-sm transition hover:-translate-y-1 hover:scale-105 hover:bg-red-50 hover:shadow-md active:scale-95 cursor-pointer"
  >
    @if (isLoadingList()) {
      <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    }
    Remove
  </button>
} @else if (inReadingList()) {
  <button
    type="button"
    (click)="removeFromReadingList()"
    [disabled]="isLoadingList()"
    [attr.aria-label]="'Remove ' + book().title + ' from your list'"
    class="inline-flex items-center gap-1.5 rounded-sm bg-linear-to-br from-sage to-paper px-3 py-1.5 text-md font-semibold border border-brand-dark shadow-sm transition hover:-translate-y-1 hover:scale-105 hover:bg-sage hover:shadow-md hover:brightness-105 active:scale-95 cursor-pointer"
  >
    @if (isLoadingList()) {
      <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    }
    In your list
  </button>
} @else {
  <button
    type="button"
    (click)="addToReadingList()"
    [disabled]="isLoadingList()"
    [attr.aria-label]="'Add ' + book().title + ' to your list'"
    class="inline-flex items-center gap-1.5 rounded-sm bg-paper px-3 py-1.5 text-md font-medium border border-brand shadow-sm transition hover:-translate-y-1 hover:scale-105 hover:bg-sage hover:shadow-md active:scale-95 cursor-pointer"
  >
    @if (isLoadingList()) {
      <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <path d="M12 5v14M5 12h14" />
      </svg>
    }
    Add to list
  </button>
}
