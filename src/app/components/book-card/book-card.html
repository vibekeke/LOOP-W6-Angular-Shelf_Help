

<!-- Found a fun template at https://hyperui.dev/components/marketing/cards/ -->
<a class="group">
  <div
    class="relative overflow-hidden bg-paper shadow-md transform transition-transform group-hover:-translate-x-2 group-hover:-translate-y-2"
  >
    <!-- Saved indicator -->
      @if (inReadingList()) {
        <div class="absolute top-0 right-0 w-20 h-20 bg-linear-to-br from-brand to-brand-dark [clip-path:polygon(100%_0,100%_100%,0_0)] drop-shadow-md shadow-md">
          <svg viewBox="0 0 26 26" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="absolute top-3 right-3 w-5 h-5 drop-shadow-sm">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>
      }
      <!-- No hover -->
      <div
        class="flex h-full flex-col transition-opacity"
      >
          <img
              [alt]="book().title"
              [src]="book().coverImg"
              loading="lazy"
              class="w-full min-h-0 flex-1 object-cover"
          />
          <div class="flex px-4 pt-4 @[39.5rem]:min-h-24">
              <h4 class="text-xl font-medium line-clamp-3">{{book().title}}</h4>
          </div>
      </div>

      <!-- Hover -->
      <div class="absolute flex flex-col inset-0 bg-paper px-4 py-4 opacity-0 transition-opacity 
      group-hover:opacity-100">
        <h3 class="mt-4 text-xl font-medium">{{book().title}}</h3>

        <p class="mt-4 min-h-0 flex-1 overflow-hidden text-sm sm:text-base 
        mask-[linear-gradient(to_bottom,black_60%,transparent)]">
          {{book().blurb}}
        </p>
      </div>

      <div class="px-4 py-4 shrink-0 flex justify-between relative items-center">
          <a [routerLink]="['/book-details', book().id]" class="relative font-bold text-md
            after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:bg-current
            after:origin-right after:scale-x-0 after:transition-transform after:duration-250
            hover:after:origin-left hover:after:scale-x-100">
          Read more</a>
          @if (inReadingList()) {
            <button
              type="button"
              (click)="removeFromReadingList()"
              [disabled]="isLoadingList()"
              class="inline-flex items-center gap-1.5 rounded-sm bg-linear-to-br from-sage to-paper px-3 py-1.5 text-sm font-semibold border border-brand-dark text-ink shadow-sm transition hover:-translate-y-1 hover:scale-105 hover:bg-sage hover:shadow-md hover:brightness-105 active:scale-95 cursor-pointer"
            >
              @if (isLoadingList()) {
                <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
              } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              }
              In your list
            </button>
          } @else {
            <button
              type="button"
              (click)="addToReadingList()"
              [disabled]="isLoadingList()"
              class="inline-flex items-center gap-1.5 rounded-sm bg-paper px-3 py-1.5 text-md font-medium border border-brand text-ink shadow-sm transition hover:-translate-y-1 hover:scale-105 hover:bg-sage hover:shadow-md active:scale-95 cursor-pointer"
            >  
              @if (isLoadingList()) {
                <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
              } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M12 5v14M5 12h14" />
              </svg>
            }
              Add to list
            </button>
          }
        </div>
  </div>
</a>
