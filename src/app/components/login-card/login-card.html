
<div class="w-full rounded-xl bg-linear-to-b from-accent to-sage p-8 shadow-md">
    <h1 class="mb-6 text-xl font-semibold text-slate-900">Welcome!</h1>
    <form (submit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="mb-1 block text-lg font-medium text-slate-700">Log in ( ᴗ͈ˬᴗ͈)ᯓ★</label>
        <input [(ngModel)]="username" name="username" id="username" type="text" placeholder="Username"
          class="w-full rounded-lg bg-sage border border-slate-300 px-4 py-3 text-lg 
          outline-none focus:border-accent focus:ring-2 focus:ring-brand" />
      </div>
      <button type="submit" [disabled]="!username().trim()"
        class="w-full rounded-lg bg-brand px-4 py-3 text-base font-semibold text-white 
        enabled:hover:bg-brand-dark disabled:opacity-50 disabled:cursor-not-allowed">
        Sign in
      </button>
    </form>
  </div>
