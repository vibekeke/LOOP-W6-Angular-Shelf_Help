
<div class="w-full max-w-sm rounded-xl bg-linear-to-b from-accent to-sage p-8 shadow-md">
    <h1 class="mb-6 text-xl font-semibold text-slate-900">Welcome!</h1>
    <form (submit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="mb-1 block text-md font-medium text-slate-700">Log in</label>
        <input [(ngModel)]="username" name="username" id="username" type="text" placeholder="Username"
          class="w-full rounded-lg bg-sage border border-slate-300 px-4 py-3 text-lg outline-none focus:border-white-500 focus:ring-2 focus:ring-sage-500/20" />
      </div>
      <button type="submit" [disabled]="!username().trim()"
        class="w-full rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white hover:bg-white-500 disabled:opacity-50 disabled:cursor-not-allowed">
        Sign in
      </button>
    </form>
  </div>
