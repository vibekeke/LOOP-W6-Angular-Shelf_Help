<div class="flex-1 flex items-center justify-center pb-32">
    <div>

    @if (book(); as loadedBook) {
        <div class="flex h-full flex-col transition-opacity">
            <img
                [alt]="loadedBook.title"
                [src]="loadedBook.coverImg"
                loading="lazy"
                class="w-full min-h-0 flex-1 object-cover"
            />
            <div class="flex px-4 pt-4 @[39.5rem]:min-h-24">
                <h4 class="text-xl font-medium line-clamp-3 text-ink">{{loadedBook.title}}</h4>
            </div>
        </div>
        }
    </div>
</div>
